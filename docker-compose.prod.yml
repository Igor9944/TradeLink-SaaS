# ============================================================================
# TRADELINK V6.1 — CONFIGURATION HARDENED DE PRODUCTION
# Haute disponibilité (99.9%), limites de ressources CPU/RAM, isolation réseau
# et interdiction formelle du mode Vault Dev en production
# ============================================================================

version: '3.8'

services:
  backend:
    restart: always
    environment:
      - NODE_ENV=production
    deploy:
      resources:
        limits:
          cpus: '2.00'
          memory: 2048M
        reservations:
          cpus: '0.50'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true

  app:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true

  postgres:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '4.00'
          memory: 8192M
        reservations:
          cpus: '1.00'
          memory: 2048M
    command:
      - "postgres"
      - "-c"
      - "max_connections=300"
      - "-c"
      - "shared_buffers=2GB"
      - "-c"
      - "effective_cache_size=6GB"
      - "-c"
      - "work_mem=32MB"
      - "-c"
      - "maintenance_work_mem=512MB"
      - "-c"
      - "wal_level=replica"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "synchronous_commit=on"
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"
    security_opt:
      - no-new-privileges:true

  redis:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 2048M
    command:
      - "redis-server"
      - "--requirepass"
      - "${REDIS_PASSWORD:?REDIS_PASSWORD_REQUIRED}"
      - "--maxmemory"
      - "1536mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
      - "--appendonly"
      - "yes"
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true

  minio:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2.00'
          memory: 4096M
    security_opt:
      - no-new-privileges:true

  vault:
    restart: always
    # Mode serveur durci en production (interdiction stricte de -dev ou VAULT_DEV_*)
    command: ["server", "-config=/vault/config"]
    cap_add:
      - IPC_LOCK
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 2048M
    security_opt:
      - no-new-privileges:true
