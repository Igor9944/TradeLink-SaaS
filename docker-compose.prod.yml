# ============================================================================
# TRADELINK V6.0 — CONFIGURATION HARDENED DE PRODUCTION (PROMPT 12)
# Haute disponibilité (99.9%), limites de ressources CPU/RAM et isolation
# ============================================================================

version: '3.8'

services:
  app:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2.00'
          memory: 4096M
        reservations:
          cpus: '0.50'
          memory: 1024M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true

  postgres:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '4.00'
          memory: 8192M
        reservations:
          cpus: '1.00'
          memory: 2048M
    command:
      - "postgres"
      - "-c"
      - "max_connections=300"
      - "-c"
      - "shared_buffers=2GB"
      - "-c"
      - "effective_cache_size=6GB"
      - "-c"
      - "work_mem=32MB"
      - "-c"
      - "maintenance_work_mem=512MB"
      - "-c"
      - "wal_level=replica"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "synchronous_commit=on"
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"

  redis:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 2048M
    command:
      - "redis-server"
      - "--requirepass"
      - "${REDIS_PASSWORD}"
      - "--maxmemory"
      - "1536mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
      - "--appendonly"
      - "yes"
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  minio:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2.00'
          memory: 4096M

  vault:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 2048M
