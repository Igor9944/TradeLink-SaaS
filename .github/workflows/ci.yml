# ============================================================================
# TRADELINK V6.0 — PIPELINE D'INTÉGRATION CONTINUE (CI) GITHUB ACTIONS
# Vérification qualité, types, tests 100%, audit de sécurité et build Docker
# ============================================================================

name: TRADELINK V6.0 — CI Quality & Security Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # --------------------------------------------------------------------------
  # 1. VALIDATION TYPESCRIPT & SYNTAXE
  # --------------------------------------------------------------------------
  typecheck:
    name: TypeScript Strict Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript Strict Check
        run: npx tsc --noEmit

  # --------------------------------------------------------------------------
  # 2. SUITES DE TESTS COMPLÈTES (UNITAIRES, INTÉGRATION, E2E, SÉCURITÉ)
  # --------------------------------------------------------------------------
  test-matrix:
    name: Complete Test Suites Execution
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: 1. Backend Integration Tests
        run: npm run test:backend

      - name: 2. Authentication, RBAC & Security Tests
        run: npm run test:security

      - name: 3. KYC Complete Module Tests
        run: npm run test:kyc

      - name: 4. Commercial Ecosystem Tests
        run: npm run test:commercial

      - name: 5. Logistics & Fleet Tests
        run: npm run test:logistics

      - name: 6. Accounting & Financial Engine Tests
        run: npm run test:accounting

      - name: 7. AI, OCR & Room Live Tests
        run: npm run test:ai

      - name: 8. Admin Advanced & Isolated Sandbox Tests
        run: npm run test:admin

      - name: 9. Multilingual & RTL Coverage Tests
        run: npm run test:i18n

      - name: 10. E2E Playwright Workflow Simulation
        run: npm run test:e2e

      - name: 11. Security Audit (SAST/DAST/Anti-XSS/Anti-SQLi)
        run: npm run test:security-audit

      - name: 12. Performance & Latency Benchmarks
        run: npm run test:performance

  # --------------------------------------------------------------------------
  # 3. COMPILATION FRONTEND DE PRODUCTION
  # --------------------------------------------------------------------------
  build-frontend:
    name: Production Assets Build
    runs-on: ubuntu-latest
    needs: [test-matrix]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Production Assets
        run: npm run build

      - name: Verify Bundle Size & Output
        run: |
          test -d dist
          ls -lh dist

  # --------------------------------------------------------------------------
  # 4. CONSTRUCTION & VÉRIFICATION DES CONTENEURS DOCKER
  # --------------------------------------------------------------------------
  docker-build:
    name: Docker Images Build & Scan
    runs-on: ubuntu-latest
    needs: [build-frontend]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Application Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          tags: tradelink-saas:ci-test

      - name: Build Isolated Sandbox Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.sandbox
          push: false
          tags: tradelink-sandbox:ci-test
