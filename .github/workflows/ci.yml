# ============================================================================
# TRADELINK V6.1 — PIPELINE D'INTÉGRATION CONTINUE (CI) GITHUB ACTIONS
# Ordre strict : Checkout -> pnpm/action-setup -> actions/setup-node (cache pnpm)
# -> pnpm install --frozen-lockfile -> Prisma Validate -> Typecheck -> Tests -> Build
# ============================================================================

name: TRADELINK V6.1 — CI Quality & Security Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # --------------------------------------------------------------------------
  # 1. VALIDATION TYPESCRIPT, SCHÉMA PRISMA & SYNTAXE
  # --------------------------------------------------------------------------
  typecheck:
    name: TypeScript & Prisma Strict Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js 20 with pnpm Cache
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma Schema & Generate Client
        run: |
          npx prisma validate
          npx prisma generate

      - name: Run TypeScript Strict Check
        run: npm run typecheck

  # --------------------------------------------------------------------------
  # 2. SUITES DE TESTS COMPLÈTES (UNITAIRES, INTÉGRATION, E2E, SÉCURITÉ)
  # --------------------------------------------------------------------------
  test-matrix:
    name: Complete Test Suites Execution
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js 20 with pnpm Cache
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: 1. Express HTTP Server Tests
        run: npm run test:express

      - name: 1B. Lot 1.1 Final Security & PostgreSQL 16 Migration Audit
        run: npm run test:lot1-audit

      - name: 1C. Lot 2 PostgreSQL 16, Prisma & Redis 7 Multi-Instance Persistence
        run: npm run test:lot2-persistence

      - name: 1D. Lot 3 Auth, Users, Actors, B2B Companies & Workspaces
        run: npm run test:lot3-actors

      - name: 1E. Lot 4 B2B Commercial Ecosystem, Double-Entry Accounting & Messaging
        run: npm run test:lot4-commercial

      - name: 1F. Lot 5 Room Live & Official Google Meet API Integration
        run: npm run test:lot5-roomlive

      - name: 2. Backend Integration Tests
        run: npm run test:backend

      - name: 3. Authentication, RBAC & Security Tests
        run: npm run test:security

      - name: 4. Auth Session Lifecycle & TOTP RFC 6238 Tests
        run: npm run test:auth-lifecycle

      - name: 5. KYC Complete Module Tests
        run: npm run test:kyc

      - name: 6. Commercial Ecosystem Tests
        run: npm run test:commercial

      - name: 7. Logistics & Fleet Tests
        run: npm run test:logistics

      - name: 8. Accounting & Financial Engine Tests
        run: npm run test:accounting

      - name: 9. AI, OCR & Room Live Tests
        run: npm run test:ai

      - name: 10. Notifications, Messaging & File Quarantine Tests
        run: npm run test:notifications

      - name: 11. Admin Advanced & Isolated Sandbox Tests
        run: npm run test:admin

      - name: 12. Multilingual & RTL Coverage Tests
        run: npm run test:i18n

      - name: 13. E2E Playwright Workflow Simulation
        run: npm run test:e2e

      - name: 14. Security Audit (SAST/DAST/Anti-XSS/Anti-SQLi)
        run: npm run test:security-audit

      - name: 15. Performance & Latency Benchmarks
        run: npm run test:performance

  # --------------------------------------------------------------------------
  # 3. COMPILATION FRONTEND & BACKEND DE PRODUCTION
  # --------------------------------------------------------------------------
  build-frontend:
    name: Production Frontend & Backend Build
    runs-on: ubuntu-latest
    needs: [test-matrix]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js 20 with pnpm Cache
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Frontend & Backend Production Bundles
        run: |
          npm run build
          npm run build:backend

      - name: Verify Bundle Size & Output
        run: |
          test -d dist
          test -f dist/server.cjs
          ls -lh dist

  # --------------------------------------------------------------------------
  # 4. CONSTRUCTION & VÉRIFICATION DES CONTENEURS DOCKER
  # --------------------------------------------------------------------------
  docker-build:
    name: Docker Images Build & Scan
    runs-on: ubuntu-latest
    needs: [build-frontend]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          target: backend
          push: false
          tags: tradelink-backend:ci-test

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          target: runner
          push: false
          tags: tradelink-frontend:ci-test

      - name: Build Isolated Sandbox Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.sandbox
          push: false
          tags: tradelink-sandbox:ci-test
