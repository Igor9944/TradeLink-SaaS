# ============================================================================
# TRADELINK V6.1 — PIPELINE D'INTÉGRATION CONTINUE (CI) GITHUB ACTIONS
# Ordre strict : Checkout -> pnpm/action-setup -> actions/setup-node (cache pnpm)
# -> pnpm install --frozen-lockfile -> Prisma Validate -> Typecheck -> Audit
# -> 14 Suites R1 + Suites Domaines -> Build -> Docker & Compose Validation
# ============================================================================

name: TRADELINK V6.1 — CI Quality & Security Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # --------------------------------------------------------------------------
  # 1. VALIDATION TYPESCRIPT, SCHÉMA PRISMA & AUDIT DÉPENDANCES
  # --------------------------------------------------------------------------
  typecheck:
    name: TypeScript, Prisma & Audit Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js 20 with pnpm Cache
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma Schema & Generate Client
        run: |
          pnpm exec prisma validate
          pnpm exec prisma generate

      - name: Run TypeScript Strict Check
        run: pnpm run typecheck

      - name: Run Production Dependency Security Audit
        run: pnpm audit --prod --audit-level=high

  # --------------------------------------------------------------------------
  # 2. SUITES DE TESTS COMPLÈTES (14 SUITES R1 + SUITES DOMAINES)
  # --------------------------------------------------------------------------
  test-matrix:
    name: Complete Test Suites Execution
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js 20 with pnpm Cache
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: 1. Express HTTP Server Tests (R1)
        run: pnpm run test:express

      - name: 2. Lot 1 Final Security & PostgreSQL 16 Migration Audit (R1)
        run: pnpm run test:lot1-audit

      - name: 3. Lot 2 PostgreSQL 16, Prisma & Redis 7 Persistence (R1)
        run: pnpm run test:lot2-persistence

      - name: 4. Lot 3 Auth, Users, Actors, B2B Companies & Workspaces (R1)
        run: pnpm run test:lot3-actors

      - name: 5. Lot 4 B2B Commercial Ecosystem, Accounting & Messaging (R1)
        run: pnpm run test:lot4-commercial

      - name: 6. Lot 5 Room Live & Official Google Meet API Integration (R1)
        run: pnpm run test:lot5-roomlive

      - name: 7. Lot 6 AI Exclusivity Google Gemini (R1)
        run: pnpm run test:lot6-ai-gemini

      - name: 8. Lot 7 Translation, Multilingual & RTL Support (R1)
        run: pnpm run test:lot7-translation

      - name: 9. Lot 8 Performance, Observability & Resilience (R1)
        run: pnpm run test:lot8-performance

      - name: 10. Authentication, RBAC & Security Tests (R1)
        run: pnpm run test:security

      - name: 11. Security Audit SAST/DAST/Anti-XSS/Anti-SQLi (R1)
        run: pnpm run test:security-audit

      - name: 12. E2E Playwright Workflow Simulation (R1)
        run: pnpm run test:e2e

      - name: 13. Final Harmonisation Integration Tests (R1)
        run: pnpm run test:harmonisation

      - name: 14. Global Integration Validation Tests (R1)
        run: pnpm run test:global-validation

      - name: Domain — Backend Integration Tests
        run: pnpm run test:backend

      - name: Domain — Auth Session Lifecycle & TOTP RFC 6238 Tests
        run: pnpm run test:auth-lifecycle

      - name: Domain — KYC Complete Module Tests
        run: pnpm run test:kyc

      - name: Domain — Commercial Ecosystem Tests
        run: pnpm run test:commercial

      - name: Domain — Logistics & Fleet Tests
        run: pnpm run test:logistics

      - name: Domain — Accounting & Financial Engine Tests
        run: pnpm run test:accounting

      - name: Domain — AI, OCR & Room Live Tests
        run: pnpm run test:ai

      - name: Domain — Notifications, Messaging & File Quarantine Tests
        run: pnpm run test:notifications

      - name: Domain — Admin Advanced & Isolated Sandbox Tests
        run: pnpm run test:admin

      - name: Domain — Multilingual & RTL Coverage Tests
        run: pnpm run test:i18n

      - name: Domain — Performance & Latency Benchmarks
        run: pnpm run test:performance

  # --------------------------------------------------------------------------
  # 3. COMPILATION FRONTEND & BACKEND DE PRODUCTION
  # --------------------------------------------------------------------------
  build-artifacts:
    name: Production Frontend & Backend Build
    runs-on: ubuntu-latest
    needs: [test-matrix]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js 20 with pnpm Cache
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client & Build Production Bundles
        run: |
          pnpm exec prisma generate
          pnpm run build
          pnpm run build:backend

      - name: Verify Bundle Size & Output
        run: |
          test -d dist
          test -f dist/server.cjs
          ls -lh dist

  # --------------------------------------------------------------------------
  # 4. VALIDATION COMPOSE & CONSTRUCTION DES CONTENEURS DOCKER
  # --------------------------------------------------------------------------
  docker-build:
    name: Docker Compose Config & Images Build
    runs-on: ubuntu-latest
    needs: [build-artifacts]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Production Docker Compose Configuration
        env:
          POSTGRES_PASSWORD: ci-placeholder-postgres-password-0001
          REDIS_PASSWORD: ci-placeholder-redis-password-0001
          JWT_SECRET: ci-placeholder-jwt-secret-min-32-chars-0001
          ATTACHMENT_SECRET: ci-placeholder-attachment-secret-min-32-0001
          DOCUMENT_DOWNLOAD_SECRET: ci-placeholder-doc-download-secret-32-0001
          METRICS_SCRAPE_TOKEN: ci-placeholder-metrics-scrape-token-32-0001
          KYC_SIGNING_SECRET: ci-placeholder-kyc-signing-secret-32-0001
          OCR_HMAC_SECRET: ci-placeholder-ocr-hmac-secret-min-32-0001
          ROOM_ACCESS_TOKEN_SECRET: ci-placeholder-room-access-secret-32-0001
          S3_ACCESS_KEY: ci-placeholder-s3-access-key-0001
          S3_SECRET_KEY: ci-placeholder-s3-secret-key-min-20-0001
          KMS_VAULT_TOKEN: ci-placeholder-vault-token-min-20-0001
          STRIPE_SECRET_KEY: ci-placeholder-stripe-secret-key-0001
          STRIPE_WEBHOOK_SECRET: ci-placeholder-stripe-webhook-0001
          GF_SECURITY_ADMIN_PASSWORD: ci-placeholder-grafana-password-0001
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          target: backend
          push: false
          tags: tradelink-backend:ci-test

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          target: runner
          push: false
          tags: tradelink-frontend:ci-test

      - name: Build Isolated Sandbox Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.sandbox
          push: false
          tags: tradelink-sandbox:ci-test
