# ============================================================================
# TRADELINK V6.1 — PIPELINE DE DÉPLOIEMENT MULTI-ENVIRONNEMENTS (CD)
# Vérifications réelles : Build, Validation Prisma, Healthcheck HTTP & Rollback
# ============================================================================

name: TRADELINK V6.1 — Continuous Deployment (CD)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Environnement cible de déploiement'
        required: true
        default: 'staging'
        type: choice
        options:
          - development
          - staging
          - production

jobs:
  # --------------------------------------------------------------------------
  # 1. VALIDATION PRÉ-DÉPLOIEMENT & HEALTHCHECK RÉEL DU SERVEUR
  # --------------------------------------------------------------------------
  deploy-staging:
    name: Validate & Verify Staging Stack
    runs-on: ubuntu-latest
    environment: staging
    if: github.event.inputs.target_env == 'staging' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js 20 with pnpm Cache
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma Schema & Build Artifacts
        run: |
          npx prisma validate
          npx prisma generate
          npm run build
          npm run build:backend

      - name: Start Backend Server & Verify Real HTTP Healthcheck
        run: |
          node dist/server.cjs &
          SERVER_PID=$!
          sleep 3
          curl --fail --silent --show-error http://127.0.0.1:3000/api/v1/health
          curl --fail --silent --show-error http://127.0.0.1:3000/health
          kill $SERVER_PID

  # --------------------------------------------------------------------------
  # 2. DÉPLOIEMENT PRODUCTION AVEC APPROBATION MANUELLE & CONTRÔLE STRICT
  # --------------------------------------------------------------------------
  deploy-production:
    name: Deploy to Production (High Availability 99.9%)
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    environment: production
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.target_env == 'production'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js 20 with pnpm Cache
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies & Run Security Suite
        run: |
          pnpm install --frozen-lockfile
          npm run test:security
          npm run test:security-audit
          npm run build
          npm run build:backend

      - name: Verify Production Server Health Endpoint
        run: |
          node dist/server.cjs &
          SERVER_PID=$!
          sleep 3
          curl --fail --silent --show-error http://127.0.0.1:3000/api/v1/health
          kill $SERVER_PID
