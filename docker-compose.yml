# ============================================================================
# TRADELINK V6.0 — ARCHITECTURE COMPLÈTE DOCKER COMPOSE MULTI-SERVICES
# Services : App Web, PostgreSQL 16, Redis 7, MinIO S3, HashiCorp Vault KMS,
#            Prometheus Metrics & Grafana Dashboards + Sandbox Isolée
# ============================================================================

version: '3.8'

networks:
  tradelink-internal:
    driver: bridge
  tradelink-dmz:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  vault_data:
  prometheus_data:
  grafana_data:

services:
  # --------------------------------------------------------------------------
  # 1. APPLICATION TRADELINK V6.0 SAAS B2B
  # --------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tradelink-app
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=production
      - PORT=5173
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://tradelink_user:TradeLinkStrong2026Password@postgres:5432/tradelink_db?schema=public
      - REDIS_URL=redis://:TradeLinkRedisSecret2026!@redis:6379/0
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET_DOCS=tradelink-encrypted-documents
      - S3_BUCKET_BACKUPS=tradelink-encrypted-backups
      - S3_ACCESS_KEY=tradelink_s3_admin
      - S3_SECRET_KEY=TradeLinkS3SuperSecret2026!
      - KMS_VAULT_ADDR=http://vault:8200
      - KMS_MASTER_KEY_ALIAS=alias/tradelink-prod-kek-v6
      - STRIPE_MODE=test
      - STRIPE_SECRET_KEY=sk_test_mock_tradelink_v6_key
      - STRIPE_WEBHOOK_SECRET=whsec_mock_tradelink_v6_webhook
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      vault:
        condition: service_healthy
    networks:
      - tradelink-internal
      - tradelink-dmz

  # --------------------------------------------------------------------------
  # 2. BASE DE DONNÉES POSTGRESQL 16
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: tradelink-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tradelink_user
      POSTGRES_PASSWORD: TradeLinkStrong2026Password
      POSTGRES_DB: tradelink_db
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradelink_user -d tradelink_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tradelink-internal

  # --------------------------------------------------------------------------
  # 3. CACHE ET GESTION DES SESSIONS REDIS 7 (SINGLE ACTIVE SESSION POLICY)
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: tradelink-redis
    restart: unless-stopped
    command: redis-server --requirepass "TradeLinkRedisSecret2026!" --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "TradeLinkRedisSecret2026!", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tradelink-internal

  # --------------------------------------------------------------------------
  # 4. STOCKAGE D'OBJETS COMPATIBLE S3 MINIO (PIÈCES KYC & BACKUPS CHIFFRÉS)
  # --------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: tradelink-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: tradelink_s3_admin
      MINIO_ROOT_PASSWORD: TradeLinkS3SuperSecret2026!
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - tradelink-internal
      - tradelink-dmz

  # --------------------------------------------------------------------------
  # 5. GESTION DES CLÉS & KMS DE SOUVERAINETÉ (HASHICORP VAULT)
  # --------------------------------------------------------------------------
  vault:
    image: hashicorp/vault:1.16.2
    container_name: tradelink-vault-kms
    restart: unless-stopped
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: tradelink-kms-root-token-2026
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    volumes:
      - vault_data:/vault/file
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - tradelink-internal

  # --------------------------------------------------------------------------
  # 6. MÉTRIQUES ET SURVEILLANCE SYSTÈME PROMETHEUS
  # --------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: tradelink-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - tradelink-internal

  # --------------------------------------------------------------------------
  # 7. TABLEAU DE BORD DE SUPERVISION GRAFANA
  # --------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.0.0
    container_name: tradelink-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=TradeLinkGrafanaAdmin2026!
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - tradelink-internal
      - tradelink-dmz

  # --------------------------------------------------------------------------
  # 8. SANDBOX ISOLÉE D'ANALYSE DE DUMPS (RÉSEAU STRICTEMENT COUPÉ)
  # --------------------------------------------------------------------------
  sandbox:
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    container_name: tradelink-sandbox-worker
    network_mode: "none" # Isolation réseau physique absolue
    read_only: true
    tmpfs:
      - /sandbox/input:rw,noexec,nosuid,size=64m
      - /sandbox/output:rw,noexec,nosuid,size=64m
