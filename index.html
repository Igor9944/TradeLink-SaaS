<!doctype html>
<html lang="fr" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- MANDATORY: Declare support for both light and dark themes -->
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        const savedScheme = localStorage.getItem("color-scheme");
        // Par défaut, le thème CLAIR (lumineux / blanc) est activé pour une interface B2B claire.
        // Le mode sombre ne s'active que si l'utilisateur l'a explicitement choisi ("dark").
        const isDark = savedScheme === "dark";
        const meta = document.querySelector('meta[name="color-scheme"]');
        if (meta) {
          meta.content = isDark ? "dark" : "light";
        }
        document.documentElement.classList.toggle("dark", isDark);
      } catch (e) {}
    </script>
    <title>TRADELINK V6.0 — Plateforme SaaS B2B Commerce, Logistique, Comptabilité & IA</title>
    <link rel="icon" type="image/png" href="/icons/3d/global-reach.png" />
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-[#071E21] dark:text-slate-100 antialiased selection:bg-[#E85D22] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
